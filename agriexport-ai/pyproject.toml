[project]
name = "agriexport-ai"
version = "0.4.0"
description = "Auditable agricultural export intelligence foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "tenacity>=9,<10",
    "pyyaml>=6,<7",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
automation = [
    "mlflow-skinny>=3,<4",
    "prefect>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
