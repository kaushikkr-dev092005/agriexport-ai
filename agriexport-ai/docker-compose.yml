services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agriexport
      POSTGRES_USER: agriexport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriexport"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
